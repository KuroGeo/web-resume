name: Validate public resume
on:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: node scripts/build-resume-site.mjs
      - run: python3 scripts/build-resume-previews.py
      - run: node --test tests/resume-publishing.test.mjs
      - run: node tests/validate-site.mjs
